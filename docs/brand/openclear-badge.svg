<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for modern fintech feel -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Shield / Core Element Gradient (Trust & Security) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361EE" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>

    <!-- Checkmark / Verification Gradient (Positive Pay verification) -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CC9F0" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Optional rounded container (remove if you need a transparent background) -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />

  <!-- Standalone App Icon / Badge Mark Centered -->
  <g transform="translate(15, 12)" filter="url(#dropShadow)">
    <!-- Outer Shield / Vault Frame -->
    <path d="M 85 10 
             C 125 10, 150 25, 150 65 
             C 150 110, 120 135, 85 150 
             C 50 135, 20 110, 20 65 
             C 20 25, 45 10, 85 10 Z" 
          fill="url(#shieldGrad)" 
          stroke="#4CC9F0" 
          stroke-width="3" 
          stroke-opacity="0.6" />

    <!-- Inner Bank Pillar / Ledger lines representing data rails (Checks, ACH, RTP) -->
    <rect x="52" y="52" width="12" height="52" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <rect x="79" y="44" width="12" height="68" rx="4" fill="#ffffff" fill-opacity="0.35" />
    <rect x="106" y="52" width="12" height="52" rx="4" fill="#ffffff" fill-opacity="0.2" />

    <!-- Precision Positive Pay Checkmark Overlays -->
    <path d="M 50 82 L 74 106 L 124 50" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#dropShadow)" />
  </g>
</svg>
