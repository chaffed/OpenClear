# OWASP Core Rule Set exclusions for OpenClear (docs/guides/edge.md, section 3), for
# ModSecurity or Coraza with CRS 4. Load it before the CRS rules (as
# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf). Each one is limited to a path and, where it
# can be, to the one field that carries the legitimate content, so the rest of the request is
# still inspected. Proven at paranoia levels 1 and 2 by `scripts/edge_check.py --crs`.
#
# Rule ids 1001000-1001099 are OpenClear's.

# The API and SCIM use PUT, PATCH and DELETE (CRS allows only GET, HEAD, POST and OPTIONS).
SecRule REQUEST_URI "@rx ^/(?:api/v1|scim/v2)/" \
    "id:1001000,phase:1,pass,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Markdown (messages, a customer's banner, the preview) may contain HTML-like and SQL-like text.
# OpenClear renders it, then sanitizes it to an allowlist of tags (web/templates.py).
SecRule REQUEST_URI "@rx ^/ui/markdown-preview$" \
    "id:1001010,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:text,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:text,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:text,ctl:ruleRemoveTargetById=931130;ARGS:text"
SecRule REQUEST_URI "@rx ^/ui/settings/messages$" \
    "id:1001011,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:login_message,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:banner_message,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:login_message,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:banner_message,ctl:ruleRemoveTargetById=931130;ARGS:login_message,ctl:ruleRemoveTargetById=931130;ARGS:banner_message"
SecRule REQUEST_URI "@rx ^/ui/customers/[0-9a-f-]+/banner$" \
    "id:1001012,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:banner_message,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:banner_message,ctl:ruleRemoveTargetById=931130;ARGS:banner_message"

# A SAML response is a large base64 value whose characters trip the SQL-injection character
# rules at paranoia level 2. OpenClear verifies its XML signature.
SecRule REQUEST_URI "@rx ^/ui/sso/saml/[^/]+/[^/]+/acs$" \
    "id:1001020,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:SAMLResponse"

# Settings that are URLs on other hosts (webhook receivers, identity providers, embedding
# origins) trip the remote-file-inclusion rule. OpenClear accepts only https and public addresses.
SecRule REQUEST_URI "@rx ^/ui/(?:admin/webhooks|admin/sso|sign-on|settings/embedding|settings/security-events)" \
    "id:1001030,phase:1,pass,nolog,ctl:ruleRemoveById=931130"
