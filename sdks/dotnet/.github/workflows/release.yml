# Publishes OpenClear.Sdk to NuGet when a version tag (v0.1.0) is pushed. Needs the
# NUGET_API_KEY secret. Mirrored from chaffed/OpenClear's sdks/dotnet.
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet test tests/OpenClear.Tests
      - run: dotnet pack src/OpenClear -c Release -o out
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
