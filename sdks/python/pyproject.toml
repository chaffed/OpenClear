[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openclear-sdk"
version = "0.1.0"
description = "Python SDK for the OpenClear API: positive pay and ACH exception decisions for banks, cores and online banking providers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/chaffed/OpenClear"
Documentation = "https://github.com/chaffed/OpenClear/blob/main/API.md"

[tool.hatch.build.targets.wheel]
packages = ["src/openclear_sdk"]
