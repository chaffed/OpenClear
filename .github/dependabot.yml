# Dependency updates (OWASP_PLAN.md OW-D10): weekly and grouped, one PR per ecosystem; security
# updates come at once. Nothing merges itself: the local Postgres and Linux suites run first.
# The server's Python locks (requirements/*.txt, written by uv) are refreshed by
# .github/workflows/lock-refresh.yml instead; GitHub still raises alerts on them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    groups: {docker: {patterns: ["*"]}}
    # The image's Python moves with the hashed locks and the tests' matrix (3.11, 3.13), not on
    # its own: a new minor (3.15 in #73 and #81) has no wheels yet for packages the lock pins
    # (numpy, scipy, pyyaml, xmlsec), so the image doesn't build. Rebuilds of 3.13-slim still come.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directories: [/sdks/typescript, /sdks/embed]
    schedule: {interval: weekly}
    groups: {npm: {patterns: ["*"]}}
  - package-ecosystem: nuget
    directories: [/sdks/dotnet/src/OpenClear, /sdks/dotnet/tests/OpenClear.Tests]
    schedule: {interval: weekly}
    groups: {nuget: {patterns: ["*"]}}
  - package-ecosystem: pip
    directory: /sdks/python
    schedule: {interval: weekly}
    groups: {python-sdk: {patterns: ["*"]}}
