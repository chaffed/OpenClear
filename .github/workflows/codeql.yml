# Static analysis (OWASP_PLAN.md OW-D7): the server and the SDKs. The job fails while this ref
# has an open alert of high or critical security severity (CODE_SCANNING_PLAN.md CS4): fix it,
# or dismiss it on GitHub with the reason. That holds for a direct push to main too, which the
# ruleset's own code-scanning check doesn't see.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with: {category: "/language:${{ matrix.language }}"}
      - name: Fail on an open high or critical alert
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: "/language:${{ matrix.language }}"
        run: |
          open=$(gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?ref=${{ github.ref }}&state=open&tool_name=CodeQL&per_page=100" \
            --jq '.[] | select(.most_recent_instance.category == env.CATEGORY)
                      | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")
                      | "#\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"')
          if [ -n "$open" ]; then
            echo "Open high or critical CodeQL alerts (fix, or dismiss with a reason):"
            echo "$open"
            exit 1
          fi
