# Weekly: move the hashed Python locks to the newest allowed versions and open one PR
# (OWASP_PLAN.md OW-D10). Nothing merges itself: the local Postgres and Linux suites run first.
name: Lock refresh
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: scripts/lock.sh --upgrade
      - run: python scripts/audit_dependencies.py
      # The third-party inventory follows the locks (plans/THIRD_PARTY_PLAN.md TP3); its test fails otherwise.
      - run: scripts/third_party.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: lock-refresh
          title: "Weekly dependency lock refresh"
          commit-message: "Refresh the hashed dependency locks"
          body: |
            `scripts/lock.sh --upgrade`, and `scripts/audit_dependencies.py` passes on the result.
            The third-party inventory and notices are regenerated to match (`scripts/third_party.sh`).
            Run the local suites before merging (CLAUDE.md).
