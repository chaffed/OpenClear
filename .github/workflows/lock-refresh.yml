# Weekly: move the hashed Python locks to the newest allowed versions and open one PR
# (OWASP_PLAN.md OW-D10). Nothing merges itself: the local Postgres and Linux suites run first.
name: Lock refresh
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: scripts/lock.sh --upgrade
      - run: python scripts/audit_dependencies.py
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          branch: lock-refresh
          title: "Weekly dependency lock refresh"
          commit-message: "Refresh the hashed dependency locks"
          body: |
            `scripts/lock.sh --upgrade`, and `scripts/audit_dependencies.py` passes on the result.
            Run the local suites before merging (CLAUDE.md).
