name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound of pyproject.toml's requires-python, plus the version this repo is
        # actually developed against — not a full matrix of everything in between.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # tesseract-ocr: the default (and only fully working) OCR provider.
          # libpango-1.0-0/libcairo2: WeasyPrint's native deps for the documentation PDF
          # export -- without these, tests/test_web/test_docs_pdf.py just skips itself
          # (see weasyprint_usable()), so installing them here means CI actually exercises
          # that code path instead of perpetually skipping it.
          sudo apt-get install -y tesseract-ocr libpango-1.0-0 libcairo2

      - name: Install OpenClear (dev + pdf extras)
        run: pip install -e ".[dev,pdf]"

      - name: Run tests
        run: pytest

  test-postgres:
    # The same suite against a real Postgres (tests/conftest.py's OPENCLEAR_TEST_DATABASE_URL):
    # the schema comes from `alembic upgrade head`, so this also proves the migrations work
    # on Postgres, and tests/test_postgres/ checks row-level security under a
    # non-superuser role.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openclear
          POSTGRES_PASSWORD: openclear
          POSTGRES_DB: openclear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openclear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENCLEAR_TEST_DATABASE_URL: postgresql+psycopg://openclear:openclear@localhost:5432/openclear_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpango-1.0-0 libcairo2

      - name: Install OpenClear (dev + pdf + postgres extras)
        run: pip install -e ".[dev,pdf,postgres]"

      - name: Run tests against Postgres
        run: pytest
