name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each suite runs in three shards side by side (OPENCLEAR_TEST_SHARD; tests/conftest.py splits by
  # file). The jobs the ruleset requires, test (3.11), test (3.13) and test-postgres, are at the end:
  # each passes only when all its shards did (plans/TEST_SPEED_PLAN.md TS-D3).
  shard:
    name: shard (${{ matrix.python-version }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound of pyproject.toml's requires-python, plus the version this repo is
        # actually developed against — not a full matrix of everything in between.
        python-version: ["3.11", "3.13"]
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # tesseract-ocr: the default (and only fully working) OCR provider.
          # libpango-1.0-0/libcairo2: WeasyPrint's native deps for the documentation PDF
          # export -- without these, tests/test_web/test_docs_pdf.py just skips itself
          # (see weasyprint_usable()), so installing them here means CI actually exercises
          # that code path instead of perpetually skipping it.
          sudo apt-get install -y tesseract-ocr libpango-1.0-0 libcairo2

      - name: Install OpenClear from the hashed lock
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .

      # The browser tests (axe accessibility, viewports, the phone layouts) run in this one job:
      # they test the pages, not the Python version or the database (plans/TEST_SPEED_PLAN.md
      # TS-D1). Without Chromium they skip themselves, which is what they used to do everywhere.
      - name: Install Chromium for the browser tests
        if: matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          OPENCLEAR_TEST_SHARD: ${{ matrix.shard }}/3
        # worksteal: idle workers take queued tests from busy ones, so a long test doesn't hold the run.
        # (Not `cond && '' || ...`: an empty string is false in an expression, so that always picks the right side.)
        run: pytest -n auto --dist worksteal -ra ${{ matrix.python-version != '3.13' && '-m "not browser"' || '' }}

  postgres-shard:
    name: postgres shard (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The same suite against a real Postgres (tests/conftest.py's OPENCLEAR_TEST_DATABASE_URL):
    # the schema comes from `alembic upgrade head`, so this also proves the migrations work
    # on Postgres, and tests/test_postgres/ checks row-level security under a
    # non-superuser role.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openclear
          POSTGRES_PASSWORD: openclear
          POSTGRES_DB: openclear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openclear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENCLEAR_TEST_DATABASE_URL: postgresql+psycopg://openclear:openclear@localhost:5432/openclear_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpango-1.0-0 libcairo2

      - name: Install OpenClear from the hashed lock
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .

      - name: Run tests against Postgres
        env:
          OPENCLEAR_TEST_SHARD: ${{ matrix.shard }}/3
        run: pytest -n auto --dist worksteal -ra -m "not browser"

  # The checks the ruleset requires: one per suite, passing only when every shard of it passed.
  test:
    name: test (${{ matrix.python-version }})
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: All shards passed
        run: test "${{ needs.shard.result }}" = success

  test-postgres:
    if: always()
    needs: postgres-shard
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.postgres-shard.result }}" = success
