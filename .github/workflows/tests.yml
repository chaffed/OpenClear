name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tesseract runs OpenMP threads, one per core, for every image. With pytest-xdist's workers each
  # running OCR at once, the threads crowd each other out and a small image can take over the
  # 30-second OCR timeout (on main at 9ecc86e). One thread each; the workers are the parallelism.
  OMP_THREAD_LIMIT: "1"

jobs:
  # Each suite runs in three shards side by side (OPENCLEAR_TEST_SHARD; tests/conftest.py splits by
  # file). The jobs the ruleset requires, test (3.11), test (3.13) and test-postgres, are at the end:
  # each passes only when all its shards did (plans/TEST_SPEED_PLAN.md TS-D3). Every job runs in the
  # CI image (ci/Dockerfile; TS-D8), pinned by digest: what the suite needs from the operating system
  # is already there, so no job runs apt. .github/workflows/ci-image.yml moves the digests by pull
  # request when it rebuilds the image.
  shard:
    name: shard (${{ matrix.python-version }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound of pyproject.toml's requires-python, plus the version this repo is
        # actually developed against — not a full matrix of everything in between.
        python-version: ["3.11", "3.13"]
        shard: [1, 2, 3]
        include:
          - python-version: "3.11"
            image: ghcr.io/chaffed/openclear-ci@sha256:2bae1102503c0e85bcaaf7780dfd006abd94f281e2644d39e1379619cc8c42e8  # py3.11
          - python-version: "3.13"
            image: ghcr.io/chaffed/openclear-ci@sha256:921ef8081264154aa92f27fd30013a2aa1f447ec1636528c4ad77a11ddb37e83  # py3.13
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install OpenClear from the hashed lock
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .

      # The browser tests (axe accessibility, viewports, the phone layouts) run in the 3.13 shards:
      # they test the pages, not the Python version or the database (plans/TEST_SPEED_PLAN.md
      # TS-D1). The image has the headless Chromium for the locked Playwright; this only downloads
      # one (seconds, no system libraries) when the lock has moved on since the image was built.
      - name: Chromium for the browser tests
        if: matrix.python-version == '3.13'
        run: python -m playwright install --only-shell chromium

      - name: Run tests
        env:
          OPENCLEAR_TEST_SHARD: ${{ matrix.shard }}/3
        # worksteal: idle workers take queued tests from busy ones, so a long test doesn't hold the run.
        # (Not `cond && '' || ...`: an empty string is false in an expression, so that always picks the right side.)
        run: pytest -n auto --dist worksteal -ra ${{ matrix.python-version != '3.13' && '-m "not browser"' || '' }}

  postgres-shard:
    name: postgres shard (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The same suite against a real Postgres (tests/conftest.py's OPENCLEAR_TEST_DATABASE_URL):
    # the schema comes from `alembic upgrade head`, so this also proves the migrations work
    # on Postgres, and tests/test_postgres/ checks row-level security under a
    # non-superuser role.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/chaffed/openclear-ci@sha256:921ef8081264154aa92f27fd30013a2aa1f447ec1636528c4ad77a11ddb37e83  # py3.13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openclear
          POSTGRES_PASSWORD: openclear
          POSTGRES_DB: openclear_test
        options: >-
          --health-cmd "pg_isready -U openclear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Inside a container the service is reached by its name, not localhost.
      OPENCLEAR_TEST_DATABASE_URL: postgresql+psycopg://openclear:openclear@postgres:5432/openclear_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install OpenClear from the hashed lock
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .

      - name: Run tests against Postgres
        env:
          OPENCLEAR_TEST_SHARD: ${{ matrix.shard }}/3
        run: pytest -n auto --dist worksteal -ra -m "not browser"

  # The checks the ruleset requires: one per suite, passing only when every shard of it passed.
  test:
    name: test (${{ matrix.python-version }})
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: All shards passed
        run: test "${{ needs.shard.result }}" = success

  test-postgres:
    if: always()
    needs: postgres-shard
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.postgres-shard.result }}" = success
