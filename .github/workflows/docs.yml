# Builds the developer docs site (scripts/build_docs_site.py) and publishes it to GitHub
# Pages, on every push to main that touches the docs.
name: Docs
on:
  push:
    branches: [main]
    paths: ["**.md", "scripts/build_docs_site.py", "docs/**", "sdks/**/README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r requirements/dev.txt  # mkdocs, pinned and hashed
      - run: python scripts/build_docs_site.py --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
