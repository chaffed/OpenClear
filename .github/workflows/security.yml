# The security gates (OWASP_PLAN.md OW2, OW-D7, OW-D8). Each job fails the build only on
# what OW-D8 says; everything else is reported to code scanning.
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a new advisory against an unchanged lock is still caught
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    # A known vulnerability with a fix fails, unless waived (.pip-audit-waivers.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: python scripts/audit_dependencies.py

  lock-current:
    # requirements/*.txt must match pyproject.toml: a dependency added without re-locking fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: scripts/lock.sh
      - run: |
          git diff --exit-code requirements/ || { echo "::error::Lock files are stale: run scripts/lock.sh"; exit 1; }

  bandit:
    # High-severity findings fail; all findings go to code scanning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: bandit -r src -q -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with: {sarif_file: bandit.sarif, category: bandit}
      - run: bandit -r src -q --severity-level high

  secrets:
    # Any finding fails. .gitleaks.toml lists the deliberate exceptions, each with a reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {fetch-depth: 0}
      - run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
