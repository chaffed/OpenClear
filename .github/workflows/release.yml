# Attaches the CycloneDX SBOM to each GitHub release (OWASP_PLAN.md OW-D11).
name: Release SBOM
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: {description: "Release tag, e.g. v1.22.0", required: true}

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the release asset
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {ref: "${{ env.TAG }}"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: python scripts/sbom.py -o "openclear-${TAG#v}.cdx.json"
      - run: gh release upload "$TAG" "openclear-${TAG#v}.cdx.json" --clobber
        env: {GH_TOKEN: "${{ github.token }}"}
