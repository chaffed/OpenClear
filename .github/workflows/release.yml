# Attaches the CycloneDX SBOM to each GitHub release (OWASP_PLAN.md OW-D11).
name: Release SBOM
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: {description: "Release tag, e.g. v1.22.0", required: true}

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the release asset
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: "${{ env.TAG }}"}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/dev.txt}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: python scripts/sbom.py -o "openclear-${TAG#v}.cdx.json"
      - run: gh release upload "$TAG" "openclear-${TAG#v}.cdx.json" --clobber
        env: {GH_TOKEN: "${{ github.token }}"}
