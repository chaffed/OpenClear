[project]
name = "openclear"
version = "1.7.0"
description = "Multi-tenant, multi-network positive pay platform (checks, ACH) with pluggable OCR and ML-assisted exception review."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "bcrypt>=4.1",
  "webauthn>=3.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "apscheduler>=3.10",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "joblib>=1.4",
  "pytesseract>=0.3.10",
  "pillow>=10.3",
  "authlib>=1.3",
  "httpx>=0.27",
  "markdown>=3.7",
  "nh3>=0.2",
]

[project.scripts]
# Runs background jobs in its own process (config worker_mode="external"); see
# src/openclear/workers/run.py.
openclear-worker = "openclear.workers.run:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5.1"]
opencv = ["opencv-python-headless>=4.10"]
textract = ["boto3>=1.34"]
# Shared storage and limits for several instances (SCALE_PLAN.md S6): files in an
# S3-compatible bucket (storage_backend = "s3"), rate-limit counters in Redis.
s3 = ["boto3>=1.34"]
redis = ["redis>=5"]
azure-di = ["azure-ai-documentintelligence>=1.0"]
sms = ["twilio>=8"]
# PDF export of the documentation (web/routers/docs.py). Needs Pango/Cairo/GLib on the
# host -- e.g. `brew install pango` on macOS. If a native lib isn't on the dynamic
# loader path, `import weasyprint` can raise OSError (not just ImportError); see
# doc_pdf_service.py::weasyprint_usable().
pdf = ["weasyprint>=62"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  # scripts/generate_screenshots.py only — also needs `playwright install chromium`
  # once, to fetch the browser binary itself (not a pip package).
  "playwright>=1.45",
  # tests/test_auth/test_shared_storage_and_limits.py: S3 in-process, and a fake Redis.
  "boto3>=1.34",
  "moto[s3]>=5",
  "redis>=5",
  "fakeredis[lua]>=2.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openclear = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
