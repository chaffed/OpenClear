# The hosted developer sandbox (Dockerfile.sandbox, sandbox/README.md):
#   fly deploy -c fly.sandbox.toml --local-only
app = "openclear-sandbox"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.sandbox"

[env]
  # The caller's address: Fly's proxy sets Fly-Client-IP (overwriting anything a client sends)
  # and appends its own address to X-Forwarded-For, so the last hop there is Fly's, not the
  # caller's. Only Fly's proxy can reach the app, over Fly's private network.
  OPENCLEAR_CLIENT_IP_HEADER = "Fly-Client-IP"
  OPENCLEAR_TRUSTED_PROXY_CIDRS = "172.16.0.0/12,fdaa::/16"
  OPENCLEAR_PUBLIC_BASE_URL = "https://openclear-sandbox.fly.dev"
  # A developer sandbox: keep the interactive API pages (off by default in production).
  OPENCLEAR_API_DOCS_ENABLED = "true"
  OPENCLEAR_WEBAUTHN_RP_ID = "openclear-sandbox.fly.dev"
  OPENCLEAR_WEBAUTHN_ORIGIN = "https://openclear-sandbox.fly.dev"
  OPENCLEAR_SANDBOX_LIFETIME_DAYS = "30"
  OPENCLEAR_SANDBOX_SIGNUPS_PER_HOUR = "5"
  # In-process background work: one machine, SQLite.
  OPENCLEAR_WORKER_MODE = "in_process"
  OPENCLEAR_ENABLE_HOUSEKEEPING_SCHEDULER = "true"
  OPENCLEAR_ENABLE_DECISION_OUTBOX_SCHEDULER = "true"
  OPENCLEAR_ENABLE_DISPOSITION_SCHEDULER = "true"
  OPENCLEAR_ENABLE_SECURITY_EVENT_DELIVERY_SCHEDULER = "true"
  # Scheduled control testing and attestation proposals, for the sandbox's own banks too, so an
  # evaluator sees a test history. They run only while the machine is awake (it stops when idle).
  OPENCLEAR_ENABLE_CONTROL_TEST_SCHEDULER = "true"
  OPENCLEAR_CONTROL_TESTS_INCLUDE_SANDBOXES = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine: SQLite and in-process rate limits.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "openclear_sandbox_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
