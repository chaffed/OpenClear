[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclear-plugin-example"
version = "0.1.0"
description = "An example OpenClear plugin: a fixed-width paid-items import format and a fixed-width decision file"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["openclear"]

# How OpenClear finds the plugin. Allow it with OPENCLEAR_PLUGINS=example.
[project.entry-points."openclear.plugins"]
example = "openclear_plugin_example:plugin"

[tool.setuptools.packages.find]
where = ["src"]
