# Fly.io config for the PUBLIC DEMO deployment (Dockerfile.demo) -- see README.md's
# "Docker" and "Reverse proxy / WAF deployment" sections for what every one of these
# settings is actually protecting against.
#
# Rename `app` below to something unique, pick a region with `fly platform regions`,
# then see the deployment walkthrough for the full sequence (creating the volume,
# getting signing keys onto it, setting secrets, and the first deploy).

app = "pospay-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.demo"

[env]
  # Fly's edge proxy is exactly one hop in front of the app -- this is what makes
  # web/rate_limit.py's per-IP limiting and WSUD's signer-IP capture resolve the real
  # visitor instead of Fly's own proxy address. Get this wrong (0, the default) and
  # every visitor looks like the same client; get it wrong the other way (too high) and
  # a client-supplied header could be trusted instead. See README.md's "Reverse proxy /
  # WAF deployment" section.
  OPENCLEAR_TRUSTED_PROXY_COUNT = "1"
  OPENCLEAR_WEBAUTHN_RP_ID = "pospay-demo.fly.dev"
  OPENCLEAR_WEBAUTHN_ORIGIN = "https://pospay-demo.fly.dev"
  OPENCLEAR_DEMO_TENANT_ENABLED = "true"
  # Signing keys live on the persistent volume mounted below, uploaded once via `fly ssh
  # console` -- see the deployment walkthrough. Not secrets themselves (the PATH isn't
  # sensitive, only the file contents are, which live on the volume, not here).
  OPENCLEAR_JWT_PRIVATE_KEY_PATH = "/data/keys/jwt_private.pem"
  OPENCLEAR_JWT_PUBLIC_KEY_PATH = "/data/keys/jwt_public.pem"
  OPENCLEAR_FILE_SIGNING_PRIVATE_KEY_PATH = "/data/keys/file_signing_private.pem"
  OPENCLEAR_FILE_SIGNING_PUBLIC_KEY_PATH = "/data/keys/file_signing_public.pem"
  OPENCLEAR_AUDIT_LOG_SIGNING_PRIVATE_KEY_PATH = "/data/keys/audit_log_signing_private.pem"
  OPENCLEAR_AUDIT_LOG_SIGNING_PUBLIC_KEY_PATH = "/data/keys/audit_log_signing_public.pem"
  OPENCLEAR_WSUD_SIGNING_PRIVATE_KEY_PATH = "/data/keys/wsud_signing_private.pem"
  OPENCLEAR_WSUD_SIGNING_PUBLIC_KEY_PATH = "/data/keys/wsud_signing_public.pem"

[http_service]
  internal_port = 8000
  force_https = true
  # Must stay exactly 1 -- web/rate_limit.py's limiter and services/demo_tenant_service.py's
  # idle-reset tracking are both in-process state, not shared across machines. Never run
  # `fly scale count 2` (or higher) against this app. auto_stop/auto_start are both off so
  # this doesn't cold-start mid-demo; a low-traffic demo on the smallest VM size is cheap
  # enough to just leave running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "pospay_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb, not Fly's absolute floor of 256mb -- this app imports pandas/scikit-learn/
  # numpy at startup (ml/train.py, networks/*/features.py) and trains a small demo model
  # during seeding, which 256mb risks OOM-killing. 512mb is the cheapest size that's
  # actually likely to run this reliably; drop to 256mb only if you're comfortable
  # troubleshooting an OOM-restarted machine to save the difference.
  memory = "512mb"
