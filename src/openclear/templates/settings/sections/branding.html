{% from "_macros/icon.html" import icon %}
<p class="hint">Shown throughout the app once someone signs in, and on your own login page.
  Leaving a file field empty keeps what's saved.</p>
<form method="post" action="/ui/settings/branding" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Display name <input type="text" name="name" value="{{ tenant_display_name }}" required></label>
  <label>Accent color
    <input type="color" name="accent_color" value="{{ accent_color if accent_color else '#2563eb' }}">
  </label>
  <label>Logo
    {% if ctx.has_logo %}<p><img src="/ui/branding/{{ ctx.tenant_slug }}/logo" alt="Current logo" class="brand-logo"></p>{% endif %}
    <input type="file" name="logo" accept="image/png,image/jpeg">
  </label>
  <label>Favicon
    {% if ctx.has_favicon %}<p><img src="/ui/branding/{{ ctx.tenant_slug }}/favicon" alt="Current favicon" style="max-height:20px;"></p>{% endif %}
    <input type="file" name="favicon" accept="image/png,image/jpeg,image/x-icon,image/vnd.microsoft.icon">
  </label>
  <div class="form-actions"><button type="submit">{{ icon("save") }}Save</button></div>
</form>
