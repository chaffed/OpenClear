{% from "_macros/icon.html" import icon %}
<p class="hint">Applies to every new password in your organization. A customer can require
  more, but never less.</p>
<form method="post" action="/ui/settings/password-policy">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Minimum length <input type="number" name="min_length" min="1" value="{{ password_min_length }}" required style="max-width:8em;"></label>
  <label><input type="checkbox" name="require_uppercase" {{ "checked" if password_require_uppercase else "" }}> Require an uppercase letter</label>
  <label><input type="checkbox" name="require_lowercase" {{ "checked" if password_require_lowercase else "" }}> Require a lowercase letter</label>
  <label><input type="checkbox" name="require_number" {{ "checked" if password_require_number else "" }}> Require a number</label>
  <label><input type="checkbox" name="require_symbol" {{ "checked" if password_require_symbol else "" }}> Require a symbol</label>
  <div class="form-actions"><button type="submit">{{ icon("save") }}Save</button></div>
</form>
