<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OpenClear is temporarily unavailable</title>
<!-- A self-contained page (no scripts, no other files, nothing from the app or its database)
     for a load balancer or edge network to show when OpenClear itself can't answer: 503.
     OpenClear also serves 503.html when its database is unreachable. See README.md,
     "Reverse proxy / WAF deployment". -->
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #4b5563; --accent: #2563eb; --border: #d0d5dd; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #0f172a; --text: #e5e7eb; --muted: #cbd5e1; --accent: #60a5fa; --border: #334155; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
          font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 28px 22px; }
  h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 .75rem; }
  p { margin: 0 0 .9rem; color: var(--muted); }
  .code { font-size: .85rem; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>OpenClear is temporarily unavailable</h1>
  <p>It's restarting, being updated, or can't reach its database just now. This usually takes a minute or two. Reload the page shortly. Nothing you were entering was saved, so you may need to enter it again.</p>
  <p><a href="/ui/">Go to the dashboard</a></p>
  <p class="code">Error 503</p>
</main>
</body>
</html>
